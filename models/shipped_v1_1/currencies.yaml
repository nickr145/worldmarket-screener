# Reporting currency -> country whose CPI deflates it and whose official rate converts it to USD.
# EUR uses the euro-area aggregate (WB code EMU) for CPI and Germany's PA.NUS.FCRF series for the rate.
# TWD: World Bank has no Taiwan; CPI chains from IMF inflation, FX from yfinance (TWD=X) annual mean.
USD: {cpi: USA, fx: USA}
EUR: {cpi: EMU, fx: DEU}
GBP: {cpi: GBR, fx: GBR}
